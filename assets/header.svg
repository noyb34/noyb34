<svg width="880" height="240" viewBox="0 0 880 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Patrick Roch // NOYB34</title>
  <desc id="description">Architecting Intelligent Businesses. Platforms, intelligence, product, and business.</desc>
  <defs>
    <!-- Drafting Dot Grid Pattern -->
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cfd4dc" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: "SF Mono", "Fira Code", monospace; font-size: 11px; fill: #6b7280; letter-spacing: 0.08em; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; font-size: 30px; font-weight: 800; fill: #111827; letter-spacing: -0.03em; }
    .desc { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; font-size: 18px; font-weight: 500; fill: #4b5563; }
    .tag { font-family: "SF Mono", "Fira Code", monospace; font-size: 10px; fill: #111827; letter-spacing: 0.05em; }
  </style>

  <!-- Canvas Background -->
  <rect width="880" height="240" fill="#f4f5f4" />
  <rect width="880" height="240" fill="url(#dot-grid)" />

  <!-- Outer Solid Frame -->
  <rect x="16" y="16" width="848" height="208" fill="none" stroke="#d1d5db" stroke-width="1" />

  <!-- Inner Dashed Drafting Frame -->
  <rect x="22" y="22" width="836" height="196" fill="none" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4 4" />

  <!-- Top Metadata Track -->
  <text x="40" y="52" class="mono">SHEET P-001 · ARCHITECTURE &amp; SYSTEMS</text>

  <!-- Status Badge Box -->
  <rect x="720" y="38" width="120" height="22" fill="#ffffff" stroke="#d1d5db" stroke-width="1" />
  <circle cx="732" cy="49" r="3.5" fill="#10b981" />
  <text x="743" y="53" class="mono" style="fill: #111827" font-weight="600">SYS · ONLINE</text>

  <!-- Title & Scope -->
  <text x="40" y="94" class="title">PATRICK ROCH // NOYB34</text>
  <text x="40" y="122" class="desc">Architecting Intelligent Businesses</text>

  <!-- Horizontal Drafting Divider -->
  <line x1="40" y1="145" x2="840" y2="145" stroke="#111827" stroke-width="1.5" />

  <!-- Monospace Specification Tags -->
  <g transform="translate(40, 165)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="105" height="22" fill="#ffffff" stroke="#d1d5db" stroke-width="1" />
    <text x="10" y="15" class="tag">PLATFORMS</text>

    <!-- Tag 2 -->
    <rect x="113" y="0" width="112" height="22" fill="#ffffff" stroke="#d1d5db" stroke-width="1" />
    <text x="123" y="15" class="tag">INTELLIGENCE</text>

    <!-- Tag 3 -->
    <rect x="233" y="0" width="105" height="22" fill="#ffffff" stroke="#d1d5db" stroke-width="1" />
    <text x="243" y="15" class="tag">PRODUCT</text>

    <!-- Tag 4 -->
    <rect x="346" y="0" width="93" height="22" fill="#ffffff" stroke="#d1d5db" stroke-width="1" />
    <text x="356" y="15" class="tag">BUSINESS</text>
  </g>

  <!-- Drawing Revision Bottom Annotation -->
  <text x="695" y="180" class="mono">SCALE NTS · REV 1.1</text>
</svg>
